<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><h1 data-i18n="extShortName"></h1></header>
  <dl class="status">
    <dt data-i18n="labelService"></dt><dd id="service" class="muted"></dd>
    <dt data-i18n="labelMoodle"></dt><dd id="moodle" class="muted" data-i18n="statusChecking"></dd>
    <dt data-i18n="labelLastSync"></dt><dd id="sync" class="muted"></dd>
  </dl>
  <p id="message" class="message" hidden></p>
  <div class="actions">
    <button id="connect" class="primary" data-i18n="btnConnect"></button>
    <button id="console" data-i18n="btnOpenConsole"></button>
  </div>
  <footer><a href="#" id="settings" data-i18n="linkSettings"></a></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
